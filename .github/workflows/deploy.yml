name: Angular Deployment

on:
push:
branches:
- dev
- test

jobs:

deploy-dev:
if: github.ref == 'refs/heads/dev'
runs-on: self-hosted

```
steps:
  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Packages
    run: npm install

  - name: Build Angular DEV
    run: npm run build

  - name: Deploy DEV
    shell: powershell
    run: C:\Deploy\deploy-ui-dev.ps1
```

deploy-test:
if: github.ref == 'refs/heads/test'
runs-on: self-hosted

```
steps:
  - name: Checkout Source
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Packages
    run: npm install

  - name: Build Angular TEST
    run: npm run build

  - name: Deploy TEST
    shell: powershell
    run: C:\Deploy\deploy-ui-test.ps1
```
