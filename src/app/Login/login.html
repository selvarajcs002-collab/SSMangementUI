<div class="auth-card animate-fade-in mx-auto">
  <!-- Header  thinks-->
  <div class="auth-header">
    <div class="auth-icon">
      <!-- Lock Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    </div>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Login to your account</p>
  </div>

  <form class="auth-form">
    <!-- Email Input -->
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" class="auth-input" placeholder="Enter your email" />
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" class="auth-input" placeholder="Enter your password" />
        <button type="button" class="password-toggle">
          <!-- Eye icon -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="auth-actions">
      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="auth-btn-primary">Login</button>
  </form>

  <div class="auth-divider">
    <span>OR CONTINUE WITH</span>
  </div>

  <!-- Google Button -->
  <button type="button" class="auth-btn-google">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
      <path fill="#FFC107"
        d="M43.6 20.1H42V20H24v8h11.3C34.7 32.8 30 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.8-5.8C34.1 6.3 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20c11 0 19.6-8.5 19.6-19.6 0-1.5-.2-2.9-.6-4.3z" />
      <path fill="#FF3D00"
        d="M24 4c5.3 0 10.1 2.3 13.7 6.2l-5.8 5.8C30.3 14.5 27.3 13.5 24 13.5c-6.6 0-12 5.4-12 12H4.1C5.7 13.6 13.9 4 24 4z" />
      <path fill="#4CAF50"
        d="M24 44c5.1 0 9.8-1.9 13.4-5.1l-6.1-5c-2.1 1.4-4.6 2.1-7.3 2.1-6.6 0-12-5.4-12-12H4.1C5.7 34.4 13.9 44 24 44z" />
      <path fill="#1976D2"
        d="M43.6 20.1C43.8 21.4 44 22.7 44 24c0 11-8.5 19.6-19.6 19.6v-8c6.6 0 12-5.4 12-12 0-1.2-.2-2.4-.6-3.5h-12V20h19.8z" />
    </svg>
    Sign in with Google
  </button>

  <!-- Footer -->
  <div class="auth-footer">
    <p>Don't have an account? <a href="#">Sign Up</a></p>
  </div>
</div>
