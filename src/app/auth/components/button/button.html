<button 
  [type]="type"
  (click)="handleClick($event)"
  [disabled]="disabled || isLoading"
  class="w-full flex items-center justify-center gap-3 font-semibold transition-all duration-200 rounded-[10px] login-btn"
  [ngClass]="{
    'bg-[#4096FF] text-white hover:bg-[#3285EB] text-[14px]': variant === 'primary' && !disabled,
    'bg-gray-300 text-gray-500 cursor-not-allowed text-[14px]': variant === 'primary' && disabled,
    'bg-gradient-to-r from-[#60A5FA] to-[#3B82F6] text-white hover:opacity-90 text-[15px]': variant === 'gradient' && !disabled,
    'bg-[#D1D5DB] text-[#6B7280] cursor-not-allowed text-[15px]': variant === 'gradient' && disabled,
    'border border-[#E5E7EB] bg-white text-gray-800 hover:bg-gray-50 text-[14px]': variant === 'google' && !disabled,
    'border border-[#E5E7EB] bg-white opacity-60 cursor-not-allowed text-[14px]': variant === 'google' && disabled
  }">
  
  <span *ngIf="isLoading" class="animate-spin w-5 h-5 flex-shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </span>
  <ng-content select="[icon]"></ng-content>
  <span *ngIf="!isLoading">{{ text }}</span>
  <span *ngIf="isLoading">Loading...</span>

</button>
