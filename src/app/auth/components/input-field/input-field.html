<div class="flex flex-col gap-1.5 w-full">
  <label *ngIf="label" class="text-[14px] font-bold text-[#374151]">{{ label }}</label>
  <div class="relative w-full">
    
    <div *ngIf="icon === 'email'" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[20px] h-[20px]">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.909A2.25 2.25 0 012.25 6.993V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25" />
      </svg>
    </div>

    <div *ngIf="icon === 'lock'" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[20px] h-[20px]">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    </div>

    <input 
      [type]="computedType"
      [placeholder]="placeholder"
      [value]="value()"
      [disabled]="disabled()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full border border-[#E5E7EB] h-[42px] text-[14px] text-gray-800 outline-none transition-colors duration-200 rounded-[10px] bg-[#F9FAFB] placeholder:text-gray-400 font-medium"
      [ngClass]="{
        'border-red-500 ring-1 ring-red-500/50': error,
        'focus:border-[#4096FF] focus:ring-1 focus:ring-[#4096FF]': !error,
        'pl-11': icon === 'email' || icon === 'lock',
        'pl-3': icon !== 'email' && icon !== 'lock',
        'pr-10': type === 'password',
        'pr-3': type !== 'password'
      }"
    />
    
    <button *ngIf="type === 'password'"
            type="button" 
            (click)="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-grayText hover:text-brand-textDark transition-colors focus:outline-none">
      <svg *ngIf="!isPasswordVisible()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <svg *ngIf="isPasswordVisible()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
      </svg>
    </button>
  </div>
  <p *ngIf="error" class="text-xs text-red-500 mt-1 font-medium animate-fade-in">{{ error }}</p>
</div>
