<div class="bg-[#F9FAFB] border border-[#E5E7EB] rounded-[12px] p-[14px] mt-[10px] mb-[16px] transition-colors duration-300">
  <p class="text-[11px] font-semibold text-[#6B7280] tracking-wide mb-[10px]">PASSWORD REQUIREMENTS</p>
  <div class="grid grid-cols-2 gap-y-2 gap-x-4">
    
    <div class="flex items-center gap-[6px] text-[12px] transition-colors duration-300" [ngClass]="hasMinLength() ? 'text-[#374151]' : 'text-[#9CA3AF]'">
      <div class="w-[6px] h-[6px] rounded-full flex-shrink-0 transition-colors duration-300" [ngClass]="hasMinLength() ? 'bg-[#3B82F6]' : 'bg-[#D1D5DB]'"></div>
      <span>At least 8 characters</span>
    </div>
    
    <div class="flex items-center gap-[6px] text-[12px] transition-colors duration-300" [ngClass]="hasUpperCase() ? 'text-[#374151]' : 'text-[#9CA3AF]'">
      <div class="w-[6px] h-[6px] rounded-full flex-shrink-0 transition-colors duration-300" [ngClass]="hasUpperCase() ? 'bg-[#3B82F6]' : 'bg-[#D1D5DB]'"></div>
      <span>One uppercase letter</span>
    </div>
    
    <div class="flex items-center gap-[6px] text-[12px] transition-colors duration-300" [ngClass]="hasLowerCase() ? 'text-[#374151]' : 'text-[#9CA3AF]'">
      <div class="w-[6px] h-[6px] rounded-full flex-shrink-0 transition-colors duration-300" [ngClass]="hasLowerCase() ? 'bg-[#3B82F6]' : 'bg-[#D1D5DB]'"></div>
      <span>One lowercase letter</span>
    </div>
    
    <div class="flex items-center gap-[6px] text-[12px] transition-colors duration-300" [ngClass]="hasNumeric() ? 'text-[#374151]' : 'text-[#9CA3AF]'">
      <div class="w-[6px] h-[6px] rounded-full flex-shrink-0 transition-colors duration-300" [ngClass]="hasNumeric() ? 'bg-[#3B82F6]' : 'bg-[#D1D5DB]'"></div>
      <span>One number</span>
    </div>
    
    <div class="flex items-center gap-[6px] text-[12px] transition-colors duration-300" [ngClass]="hasSpecial() ? 'text-[#374151]' : 'text-[#9CA3AF]'">
      <div class="w-[6px] h-[6px] rounded-full flex-shrink-0 transition-colors duration-300" [ngClass]="hasSpecial() ? 'bg-[#3B82F6]' : 'bg-[#D1D5DB]'"></div>
      <span>One special character</span>
    </div>

  </div>
</div>
