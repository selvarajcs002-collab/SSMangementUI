<div class="signup-page-container animate-fade-in">
  <div class="signup-card">
    <div class="signup-top-accent"></div>
    <div class="flex flex-col items-center">
      <div class="signup-icon" style="background: transparent;">
        <img src="logo.jpg" alt="SS Management Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;" />
      </div>
      <h2 class="signup-title">Create Account</h2>
      <p class="signup-subtitle">Sign up to get started with your new workspace.</p>
    </div>

    <form [formGroup]="signupForm" class="flex flex-col">
      <div class="signup-input-wrapper">
        <label class="input-label">Email Address</label>
        <app-input-field
          formControlName="email"
          type="email"
          placeholder="name@company.com"
          icon="email">
        </app-input-field>
        <div *ngIf="signupForm.controls['email'].touched && signupForm.controls['email'].invalid" class="text-red-500 text-xs mt-1">
          Valid email is required
        </div>
      </div>

      <div class="signup-input-wrapper">
        <label class="input-label">Password</label>
        <app-input-field
          formControlName="password"
          type="password"
          placeholder="Create a strong password"
          icon="lock">
        </app-input-field>
        <div *ngIf="signupForm.controls['password'].touched && signupForm.controls['password'].invalid" class="text-red-500 text-xs mt-1">
          Password is required (must meet strength requirements)
        </div>
      </div>

      <app-password-strength [password]="currentPasswordValue"></app-password-strength>

      <div class="signup-input-wrapper">
        <label class="input-label">Confirm Password</label>
        <app-input-field
          formControlName="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          icon="lock">
        </app-input-field>
        <div *ngIf="signupForm.controls['confirmPassword'].touched && signupForm.controls['confirmPassword'].invalid" class="text-red-500 text-xs mt-1">
          <span *ngIf="signupForm.controls['confirmPassword'].errors?.['required']">Please confirm your password</span>
          <span *ngIf="signupForm.controls['confirmPassword'].errors?.['passwordMismatch']">Passwords do not match</span>
        </div>
      </div>

      <div class="mt-[10px]">
        <app-button 
          text="Create Account" 
          [type]="'button'" 
          (click)="onSignup()" 
          [isLoading]="isLoading" 
          [disabled]="signupForm.invalid"
          variant="gradient">
        </app-button>
      </div>
    </form>

    <div class="footer-text">
      <p>Already have an account? <a routerLink="/login" class="text-[#3B82F6] font-[600] hover:underline cursor-pointer">Login</a></p>
    </div>
  </div>
</div>
