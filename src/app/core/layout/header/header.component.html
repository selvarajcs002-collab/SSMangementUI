<header class="header">
  <div class="header-container">
    <!-- Left Section: Logo -->
    <div class="header-left-wrap">
      <div class="header-left" routerLink="/dashboard" (click)="closeMenu()">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
            <rect width="24" height="24" rx="6" fill="#3B82F6"/>
            <path d="M7 12L10 15L17 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="brand-name">SS Management</h1>
      </div>
    </div>

    <!-- Center Section: Dynamic Toggle -->
    <div class="header-center" *ngIf="showToggle">
      <app-dynamic-toggle 
        [config]="currentConfig"
        [value]="currentValue" 
        (valueChange)="handleToggleChange($event)">
      </app-dynamic-toggle>
    </div>

    <!-- Right Section: User -->
    <div class="header-right">
      <div class="menu-shell" *ngIf="!isDashboardHome">
        <button class="burger-btn" type="button" title="Open dashboard menu" (click)="toggleMenu($event)">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="menu-panel" *ngIf="showMenu" (click)="$event.stopPropagation()">
          <div class="menu-panel-header">
            <span class="menu-kicker">Navigate</span>
            <strong>Dashboard Menu</strong>
          </div>

          <a
            class="menu-item"
            *ngFor="let item of menuItems"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="closeMenu()">
            <span class="menu-icon" [innerHTML]="item.icon | safeHtml"></span>
            <span class="menu-copy">
              <span class="menu-label">{{ item.label }}</span>
              <span class="menu-description">{{ item.description }}</span>
            </span>
          </a>
        </div>
      </div>



      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
        <div class="avatar">
          {{ userPrefix }}
        </div>
      </div>

      <div class="divider"></div>

      <button class="logout-btn" title="Logout" type="button" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
        </svg>
      </button>
    </div>
  </div>
</header>
