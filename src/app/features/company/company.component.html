<div class="company-hub animate-fade-in">
  <!-- Hero Header -->
  <header class="hub-hero">
    <div class="hub-hero-left">
      <div class="hub-icon-box" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
          <path d="M9 22v-4h6v4"/>
          <path d="M8 6h.01"/><path d="M16 6h.01"/>
          <path d="M8 10h.01"/><path d="M16 10h.01"/>
          <path d="M8 14h.01"/><path d="M16 14h.01"/>
        </svg>
      </div>
      <div>
        <span class="hub-eyebrow">DIRECTORY &amp; GST PROFILES</span>
        <h1 class="hub-title">Company Management</h1>
        <p class="hub-subtitle">Create new client profiles or update existing company names, GST numbers, and delivery destinations.</p>
      </div>
    </div>
  </header>

  <!-- Modern Action Cards -->
  <div class="hub-cards-grid">
    <a
      *ngFor="let item of companyOptions"
      [routerLink]="item.route"
      class="hub-action-card"
      [class.accent-indigo]="item.accent === 'indigo'">
      <div class="card-top-row">
        <div class="card-svg-wrap">
          <svg *ngIf="item.accent === 'blue'" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
            <path d="M9 22v-4h6v4"/>
            <path d="M12 7v6"/><path d="M9 10h6"/>
          </svg>
          <svg *ngIf="item.accent === 'indigo'" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
        <span class="card-badge">{{ item.badge }}</span>
      </div>

      <h2 class="card-title">{{ item.title }}</h2>
      <p class="card-desc">{{ item.description }}</p>

      <div class="card-cta">
        <span>{{ item.cta }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
      </div>
    </a>
  </div>
</div>
