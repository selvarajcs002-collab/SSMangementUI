<div class="register-container">
  <div class="form-card glass-panel">
    <div class="card-header">
      <div class="title-wrap">
        <span class="material-icons header-icon">add_circle</span>
        <div class="text">
          <h3>Register New Machine</h3>
          <p>Enter details to add a new asset to the production floor.</p>
        </div>
      </div>
    </div>

    <form [formGroup]="machineForm" (ngSubmit)="onSubmit()" class="machine-form">
      <!-- Section 1: Basic Info -->
      <div class="form-section">
        <h4 class="section-title">General Information</h4>
        <div class="form-grid">
          <div class="form-group">
            <label>Machine Name <span class="required">*</span></label>
            <input type="text" formControlName="machineName" class="form-control" placeholder="e.g. CNC Milling Center">
          </div>
          <div class="form-group">
            <label>Machine ID <span class="required">*</span></label>
            <input type="text" formControlName="machineId" class="form-control" placeholder="e.g. CNC-001">
          </div>
          <div class="form-group">
            <label>Machine Type <span class="required">*</span></label>
            <select formControlName="machineType" class="form-control">
              <option value="">Select Type</option>
              <option value="CNC">CNC Machine</option>
              <option value="Laser">Laser Cutter</option>
              <option value="Press">Hydraulic Press</option>
              <option value="Robotic">Robotic Arm</option>
            </select>
          </div>
          <div class="form-group">
            <label>Number of Heads</label>
            <input type="number" formControlName="heads" class="form-control">
          </div>
        </div>
      </div>

      <!-- Section 2: Technical Specs -->
      <div class="form-section">
        <h4 class="section-title">Technical Specifications</h4>
        <div class="form-grid">
          <div class="form-group">
            <label>Manufacturer</label>
            <input type="text" formControlName="manufacturer" class="form-control">
          </div>
          <div class="form-group">
            <label>Model</label>
            <input type="text" formControlName="model" class="form-control">
          </div>
          <div class="form-group">
            <label>Installation Date</label>
            <app-date-picker formControlName="installationDate" placeholder="Select date"></app-date-picker>
          </div>
          <div class="form-group">
            <label>Production Capacity (units/hr)</label>
            <input type="number" formControlName="capacity" class="form-control">
          </div>
        </div>
      </div>

      <!-- Section 3: Additional Details -->
      <div class="form-section">
        <h4 class="section-title">Additional Details</h4>
        <div class="form-grid full">
          <div class="form-group">
            <label>Machine Location</label>
            <input type="text" formControlName="location" class="form-control" placeholder="e.g. Floor 1, Sector B">
          </div>
        </div>
        
        <div class="upload-area">
          <div class="upload-placeholder">
            <span class="material-icons">cloud_upload</span>
            <p>Drag & Drop Machine Image or <span>Browse</span></p>
            <span class="subtext">PNG, JPG up to 10MB</span>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="machineForm.invalid">
          <span class="material-icons">save</span>
          Register Machine
        </button>
      </div>
    </form>
  </div>
</div>
