<div class="custom-select-wrapper" [class.is-open]="isOpen" [class.is-disabled]="disabled" [class.is-loading]="loading" [class.is-invalid]="isInvalid">
  <div class="select-trigger" (click)="toggle()">
    <div class="left-section">
      <span class="icon" *ngIf="icon" [innerHTML]="icon | safeHtml"></span>
      <span class="label" [class.has-selection]="selectedLabel">
        {{ selectedLabel || placeholder }}
      </span>
    </div>
    <div class="right-section">
      <span *ngIf="loading" class="spinner"></span>
      <span *ngIf="!loading" class="chevron animate-chevron">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </div>
  </div>

  <div class="options-menu animate-dropdown" *ngIf="isOpen">
    <div class="options-scroll">
      <div 
        *ngFor="let option of options" 
        class="option-item" 
        [class.is-selected]="option.key === selectedValue"
        (click)="selectOption(option)">
        <span class="option-text">{{ option.value }}</span>
        <span class="check-icon" *ngIf="option.key === selectedValue">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide-check"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </div>
      
      <div class="no-options" *ngIf="!options || options.length === 0">
        No options available
      </div>
    </div>
  </div>
</div>
