<div class="modal-backdrop animate-fade-in" (click)="onCancel()">
  <div class="modal-container animate-slide-up" (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-left">
        <h2>Select Sizes - {{ colourName }}</h2>
        <div class="info-alert">
          <span class="info-icon">i</span>
          <p>These sizes are available in the inward for the selected style, design and colour.</p>
        </div>
      </div>
      <button class="btn-close" (click)="onCancel()" title="Close">
        <span [innerHTML]="icons.x | safeHtml"></span>
      </button>
    </div>

    <!-- Modal Content -->
    <div class="modal-content" style="padding: 0;">
      
      <table class="sizes-table">
        <thead>
          <tr>
            <th class="col-checkbox"></th>
            <th>SIZE</th>
            <th>AVAILABLE QUANTITY (PCS)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of availableSizes" (click)="toggleSize(item.size)">
            <td class="col-checkbox">
              <div class="custom-checkbox" [class.checked]="selectedSizes.has(item.size)">
                <span *ngIf="selectedSizes.has(item.size)" [innerHTML]="icons.check | safeHtml"></span>
              </div>
            </td>
            <td>{{ item.size }}</td>
            <td>{{ item.availableQty }}</td>
          </tr>
        </tbody>
      </table>

    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <div class="footer-left">
        Available Sizes : {{ availableSizes.length }}
      </div>
      <div class="footer-right">
        <button class="btn-cancel-modal" (click)="onCancel()">Cancel</button>
        <button class="btn-confirm-modal" 
                (click)="onConfirm()" 
                [disabled]="selectedSizes.size === 0">
          Add Selected {{ selectedSizes.size > 0 ? '(' + selectedSizes.size + ')' : '' }}
        </button>
      </div>
    </div>

  </div>
</div>
